<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>每日系统</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f4f0;--bg3:#eeecea;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9e9e9e;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --purple:#7F77DD;--teal:#1D9E75;--amber:#BA7517;
  --coral:#D85A30;--blue:#378ADD;--gray:#888780;
  --radius:12px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --text:#f0f0f0;--text2:#a0a0a0;--text3:#666;
    --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto}

/* ── TOP BAR ── */
.topbar{padding:14px 16px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.tb-time{font-size:28px;font-weight:300;color:var(--text);letter-spacing:-0.5px;line-height:1}
.tb-date{font-size:12px;color:var(--text3);margin-top:3px}
.tb-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.wpills{display:flex;gap:4px}
.wp{font-size:11px;padding:3px 10px;border-radius:99px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.wp.on{background:#EEEDFE;border-color:var(--purple);color:#3C3489}
@media(prefers-color-scheme:dark){.wp.on{background:#2a2850;color:#AFA9EC}}
.prow{display:flex;align-items:center;gap:8px}
.pcount{font-size:11px;color:var(--text3)}
.pbar-wrap{flex:1;max-width:80px;height:2px;background:var(--border);border-radius:99px}
.pbar-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

/* ── BODY ── */
.body{display:flex;flex:1;overflow:hidden}

/* ── LEFT LIBRARY ── */
.lib{width:80px;flex-shrink:0;border-right:0.5px solid var(--border);overflow-y:auto;padding:10px 6px;display:flex;flex-direction:column;gap:6px}
.lib-block{padding:7px 6px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg2);cursor:grab;font-size:11px;font-weight:500;color:var(--text2);text-align:center;line-height:1.3;user-select:none;-webkit-tap-highlight-color:transparent;transition:opacity .1s}
.lib-block:active{opacity:.6;cursor:grabbing}
.lib-dot{width:6px;height:6px;border-radius:50%;margin:0 auto 4px}

/* ── MAIN FLOW ── */
.main{flex:1;overflow-y:auto;padding:12px 12px 40px}

.flow{display:flex;flex-direction:column}
.brow{display:flex;align-items:stretch}
.spine{width:24px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.sdot{width:9px;height:9px;border-radius:50%;margin-top:17px;flex-shrink:0}
.sline{width:1.5px;flex:1;background:var(--border);margin-top:3px}

/* card states */
.card{flex:1;margin-bottom:10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,opacity .15s}
.card.active{border-width:1.5px}
.card.done{opacity:.4;cursor:pointer}
.card.dim{opacity:.35}

.chead{padding:17px 17px 0;display:flex;align-items:flex-start;gap:8px}
.chead-left{flex:1;min-width:0}
.trig{font-size:11px;color:var(--text3);margin-bottom:4px}
.ctitle{font-size:17px;font-weight:600;color:var(--text);margin-bottom:11px}
.done .ctitle{text-decoration:line-through}
.ccheck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:background .15s,border-color .15s}
.ccheck.on::after{content:'';width:4px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block}

.pills{display:flex;flex-wrap:wrap;gap:5px;padding:0 17px 13px}
.pill{font-size:12px;padding:4px 11px;border-radius:99px;border:0.5px solid var(--border);color:var(--text2);background:var(--bg2);transition:opacity .15s}
.pill.done{text-decoration:line-through;opacity:.4}

.rule{font-size:12px;color:var(--text3);padding:7px 11px;margin:0 17px 13px;background:var(--bg2);border-radius:6px;border-left:2px solid var(--border2)}

/* time strip */
.tstrip{padding:11px 17px;border-top:0.5px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:5px;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none}
.tstrip.draggable{cursor:ew-resize;touch-action:none}
.tstrip-fill{position:absolute;left:0;top:0;bottom:0;pointer-events:none;transition:width .08s}
.tval{font-size:13px;font-weight:600;color:var(--text);position:relative}
.tsub{font-size:11px;color:var(--text3);position:relative}
.tdur{font-size:12px;color:var(--text3);margin-left:auto;position:relative;opacity:0.6}


/* drop zone highlight */
.drop-active{border:1.5px dashed var(--teal) !important;background:rgba(29,158,117,.05)}
.card.dragging{opacity:.25}
.lib.lib-dropzone{background:rgba(29,158,117,.09);border-right-color:var(--teal)}

/* ── CHECKLIST ── */
.checklist{padding:0 12px 32px}
.sep{height:1px;background:var(--border);margin:4px 0 14px}
.clhead{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.clrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.clrow:last-of-type{border-bottom:none}
.clbox{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.clbox.on{background:var(--teal);border-color:var(--teal)}
.clbox.on::after{content:'';width:4px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block}
.cllabel{font-size:13px;color:var(--text)}
.clrow.done .cllabel{text-decoration:line-through;color:var(--text3)}
.tinp{width:100%;font-size:13px;padding:9px 11px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);margin-top:12px;outline:none}
.tinp:focus{border-color:var(--purple)}
.tinp::placeholder{color:var(--text3)}
.tsaved{margin-top:7px;font-size:12px;padding:8px 12px;background:rgba(29,158,117,.08);border-radius:var(--radius-sm);color:var(--teal);border-left:2px solid var(--teal);display:none}
.bbar{display:flex;justify-content:flex-end;margin-top:14px}
.rbtn{font-size:11px;color:var(--text3);border:none;background:none;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tb-time" id="clock">--:--</div>
    <div class="tb-date" id="datestr"></div>
    <div class="tb-bottom">
      <div class="wpills" id="wpills">
        <button class="wp" onclick="setWake(450,this)">7:30</button>
        <button class="wp" onclick="setWake(480,this)">8:00</button>
        <button class="wp" onclick="setWake(510,this)">8:30</button>
        <button class="wp" onclick="setWake(540,this)">9:00</button>
        <button class="wp on" onclick="setWake(570,this)">9:30</button>
      </div>
      <div class="prow">
        <div class="pbar-wrap"><div class="pbar-fill" id="pf" style="width:0%"></div></div>
        <span class="pcount" id="pc">0 / 4</span>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- LEFT LIBRARY -->
    <div class="lib" id="lib">
      <!-- populated by JS -->
    </div>

    <!-- MAIN SCROLL -->
    <div class="main" id="main-scroll">
      <div class="flow" id="flow"></div>
      <div class="checklist">
        <div class="sep"></div>
        <div class="clhead">🌙 睡前清单</div>
        <div class="clrow" onclick="toggleCl(this)"><div class="clbox"></div><span class="cllabel">背包：电脑、充电器、耳机、水杯</span></div>
        <div class="clrow" onclick="toggleCl(this)"><div class="clbox"></div><span class="cllabel">运动服已放进包里</span></div>
        <div class="clrow" onclick="toggleCl(this)"><div class="clbox"></div><span class="cllabel">酸奶在冰箱，麦片在桌上</span></div>
        <div class="clrow" onclick="toggleCl(this)"><div class="clbox"></div><span class="cllabel">明天第一件事已写下</span></div>
        <input class="tinp" id="ti" placeholder="明天坐下第一件事是…" oninput="saveTmr()">
        <div class="tsaved" id="ts"></div>
        <div class="bbar"><button class="rbtn" onclick="resetAll()">重置今日</button></div>
      </div>
    </div>

  </div>
</div>

<script>
// ── DATA ──
const DOTS = ['#7F77DD','#1D9E75','#1D9E75','#BA7517','#888780','#D85A30','#378ADD','#E0956A','#5BAFD6'];

const LIB_BLOCKS = [
  {id:'meeting', name:'开会',    dur:60, mn:15,mx:120,fz:false,pills:['准备议题','记录要点'],rule:null},
  {id:'call',    name:'电话',    dur:30, mn:10,mx:60, fz:false,pills:['确认时间'],rule:null},
  {id:'break',   name:'休息',    dur:20, mn:10,mx:60, fz:false,pills:['离开屏幕'],rule:null},
  {id:'errand',  name:'外出',    dur:45, mn:15,mx:120,fz:false,pills:[],rule:null},
  {id:'reading', name:'阅读',    dur:30, mn:15,mx:90, fz:false,pills:[],rule:null},
];

const DEFAULT_FLOW = [
  {id:'breakfast',name:'固定早餐',   trig:'起床后 → 立刻触发',    pills:['高蛋白酸奶','麦片','喝水'],        rule:'5分钟吃完，不开电脑不刷手机',    dur:15,mn:5,  mx:25, fz:false},
  {id:'commute',  name:'出门去咖啡馆',trig:'早餐后 → 15分钟内出门',pills:['背包已备好','运动服在包里','充电器','水杯'],rule:'坐下即开始',dur:10,mn:5,mx:20,fz:false},
  {id:'work',     name:'求职深度块', trig:'坐下 → 立刻开始',      pills:['有截止日期的优先','冷邮件','材料打磨'],rule:'90分钟底线，状态好就继续',dur:100,mn:60,mx:200,fz:false},
  {id:'lunch',    name:'午餐',       trig:'深度块结束后',         pills:['蛋白质','蔬菜','一种碳水'],        rule:null,                             dur:45,mn:20, mx:75, fz:false},
  {id:'free',     name:'轻任务',     trig:'顺序到了自然开始',     pills:['scraper维护','回邮件','刷职位'],   rule:null,                             dur:90,mn:30, mx:180,fz:true},
  {id:'gym',      name:'健身',       trig:'晚饭前 → 换衣服出门',  pills:['换运动服','走路5分钟'],           rule:'换衣服=出发信号',                dur:60,mn:30, mx:90, fz:true},
  {id:'dinner',   name:'晚饭 + 补剂',trig:'健身后',               pills:['蛋白质优先','碳水减半','镁·Omega-3'],rule:null,                           dur:45,mn:30, mx:60, fz:true},
];

const MAX_ACTIVE = 4;
let wakeMin = 570;
let flowBlocks = DEFAULT_FLOW.map(d=>({...d}));
let doneState = flowBlocks.map(()=>false);
let pdoneState = flowBlocks.map(d=>d.pills.map(()=>false));
let draggingFlowIdx = -1;

// ── CLOCK ──
function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh + ':' + mm;
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('datestr').textContent =
    now.getFullYear()+'年'+months[now.getMonth()]+now.getDate()+'日 '+days[now.getDay()];
}
setInterval(updateClock, 10000);
updateClock();

// ── HELPERS ──
function hm(m){return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function getTimes(){
  let c = wakeMin;
  return flowBlocks.map((_,i)=>{const s=c;c+=flowBlocks[i].dur;return{s,e:c}});
}

// active window: first undone non-fuzzy + up to MAX_ACTIVE-1 after it, including fuzzy
function getActiveSet(){
  const set = new Set();
  let firstUndone = -1;
  for(let i=0;i<flowBlocks.length;i++){
    if(!doneState[i]){firstUndone=i;break;}
  }
  if(firstUndone === -1) return set;
  let count = 0;
  for(let i=firstUndone;i<flowBlocks.length && count<MAX_ACTIVE;i++){
    set.add(i);
    count++;
  }
  return set;
}

// ── RENDER LIBRARY ──
function renderLib(){
  const lib = document.getElementById('lib');
  lib.innerHTML = '';
  LIB_BLOCKS.forEach((b,i)=>{
    const el = document.createElement('div');
    el.className = 'lib-block';
    el.draggable = true;
    el.dataset.libIdx = i;
    el.innerHTML = `<div class="lib-dot" style="background:${DOTS[(i+4)%DOTS.length]}"></div>${b.name}`;
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('libIdx', i);
      e.dataTransfer.effectAllowed = 'copy';
    });
    lib.appendChild(el);
  });
}

// ── RENDER FLOW ──
function render(){
  const times = getTimes();
  const activeSet = getActiveSet();
  const flow = document.getElementById('flow');
  flow.innerHTML = '';

  flowBlocks.forEach((d,i)=>{
    const {s,e} = times[i];
    const isActive = activeSet.has(i);
    const isDone = doneState[i];
    const isDim = !isActive && !isDone;

    const row = document.createElement('div');
    row.className = 'brow';

    const spine = document.createElement('div');spine.className='spine';
    const dot = document.createElement('div');dot.className='sdot';dot.style.background=DOTS[i%DOTS.length];
    const line = document.createElement('div');line.className='sline';
    spine.appendChild(dot);spine.appendChild(line);

    const dotColor = DOTS[i % DOTS.length];
    const card = document.createElement('div');
    card.className = 'card' + (isActive&&!isDone?' active':'') + (isDone?' done':'') + (isDim?' dim':'');
    if(isActive && !isDone) card.style.borderColor = dotColor;

    // click card to toggle done
    card.addEventListener('click', e=>{
      if(e.target.closest('.tstrip')||e.target.closest('.pill')) return;
      toggleDone(i);
    });

    // drag card out to lib
    card.draggable = true;
    card.addEventListener('dragstart', e=>{
      draggingFlowIdx = i;
      e.dataTransfer.setData('flowIdx', String(i));
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(()=>card.classList.add('dragging'));
    });
    card.addEventListener('dragend', ()=>{
      draggingFlowIdx = -1;
      card.classList.remove('dragging');
    });

    // drag-over for lib blocks
    card.addEventListener('dragover', e=>{
      if(draggingFlowIdx !== -1) return;
      e.preventDefault();card.classList.add('drop-active');
    });
    card.addEventListener('dragleave', ()=>card.classList.remove('drop-active'));
    card.addEventListener('drop', e=>{
      card.classList.remove('drop-active');
      const libIdx = parseInt(e.dataTransfer.getData('libIdx'));
      if(isNaN(libIdx)) return;
      insertLibBlock(libIdx, i);
    });

    const head = document.createElement('div');head.className='chead';
    const checkStyle = isDone ? `background:${dotColor};border-color:${dotColor}` : '';
    head.innerHTML = `<div class="chead-left"><div class="trig">${d.trig||''}</div><div class="ctitle">${d.name}</div></div><div class="ccheck${isDone?' on':''}" style="${checkStyle}"></div>`;
    card.appendChild(head);

    if(d.pills && d.pills.length){
      const pillsEl = document.createElement('div');pillsEl.className='pills';
      d.pills.forEach((p,pi)=>{
        const pl = document.createElement('span');
        pl.className='pill'+(pdoneState[i][pi]?' done':'');
        pl.textContent=p;
        pl.addEventListener('click',e=>{
          e.stopPropagation();
          pdoneState[i][pi]=!pdoneState[i][pi];
          pl.classList.toggle('done',pdoneState[i][pi]);
        });
        pillsEl.appendChild(pl);
      });
      card.appendChild(pillsEl);
    }

    if(d.rule){
      const r=document.createElement('div');r.className='rule';r.textContent=d.rule;card.appendChild(r);
    }

    const pct = Math.min(100, Math.round(((d.dur-d.mn)/(d.mx-d.mn))*100));
    const ts = document.createElement('div');
    ts.className = 'tstrip' + (isActive&&!isDone?' draggable':'');
    ts.id = 'ts'+i;
    const fillEl = document.createElement('div');
    fillEl.className='tstrip-fill';fillEl.id='tf'+i;
    fillEl.style.cssText=`width:${pct}%;background:${DOTS[i%DOTS.length]};opacity:0.13`;
    ts.appendChild(fillEl);
    ts.insertAdjacentHTML('beforeend',`<span class="tval" id="tstart${i}">${hm(s)}</span><span class="tsub">→</span><span class="tval" id="te${i}">${hm(e)}</span><span class="tdur" id="dl${i}">${d.dur}分钟</span>`);
    ts.addEventListener('click',e=>e.stopPropagation());
    card.appendChild(ts);
    if(isActive&&!isDone) requestAnimationFrame(()=>setupDrag(i,d));

    row.appendChild(spine);row.appendChild(card);
    flow.appendChild(row);
  });

  updateProg();
}

// ── DRAG SLIDER ──
function setupDrag(i,d){
  const ts=document.getElementById('ts'+i);
  const fill=document.getElementById('tf'+i);
  const lbl=document.getElementById('dl'+i);
  const endEl=document.getElementById('te'+i);
  if(!ts) return;

  const cardEl = ts.closest('.card');
  function upd(cx){
    const rect=ts.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
    const nd=Math.round((d.mn+pct*(d.mx-d.mn))/5)*5;
    flowBlocks[i].dur=nd;
    const dp=Math.round(((nd-d.mn)/(d.mx-d.mn))*100);
    if(fill) fill.style.width=dp+'%';
    if(lbl) lbl.textContent=nd+'分钟';
    const times=getTimes();const{e}=times[i];
    if(endEl) endEl.textContent=hm(e);
    updateFuzzy(times);
  }

  ts.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();
    upd(e.clientX);
    const mv=ev=>upd(ev.clientX);
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  ts.addEventListener('touchstart',e=>{
    e.preventDefault();e.stopPropagation();
    upd(e.touches[0].clientX);
    const mv=ev=>upd(ev.touches[0].clientX);
    const up=()=>{document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up)};
    document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
  });
}

function updateFuzzy(times){
  times.forEach(({s},j)=>{
    const el=document.getElementById('tstart'+j);
    if(el) el.textContent=hm(s);
  });
}

// ── DONE TOGGLE ──
function toggleDone(i){
  doneState[i]=!doneState[i];
  render();
}

// ── INSERT LIB BLOCK ──
function insertLibBlock(libIdx, afterIdx){
  const lb = LIB_BLOCKS[libIdx];
  const newBlock = {
    ...lb,
    id: lb.id+'_'+Date.now(),
    trig: '插入块',
  };
  flowBlocks.splice(afterIdx+1, 0, newBlock);
  doneState.splice(afterIdx+1, 0, false);
  pdoneState.splice(afterIdx+1, 0, lb.pills.map(()=>false));
  render();
}

// ── WAKE ──
function setWake(mins, btn){
  document.querySelectorAll('.wp').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  wakeMin=mins;render();
}

// ── PROGRESS ──
function updateProg(){
  const fixed=flowBlocks.filter(d=>!d.fz).length;
  const cnt=doneState.filter((v,i)=>v&&!flowBlocks[i].fz).length;
  document.getElementById('pc').textContent=cnt+' / '+fixed;
  document.getElementById('pf').style.width=Math.round(cnt/fixed*100)+'%';
}

// ── CHECKLIST ──
function toggleCl(row){row.classList.toggle('done');row.querySelector('.clbox').classList.toggle('on')}
function saveTmr(){
  const v=document.getElementById('ti').value.trim();
  const s=document.getElementById('ts');
  if(v){s.textContent='✓ '+v;s.style.display='block';}else s.style.display='none';
}

// ── LIB DROP ZONE ──
function setupLibDrop(){
  const lib = document.getElementById('lib');
  lib.addEventListener('dragover', e=>{
    if(draggingFlowIdx === -1) return;
    e.preventDefault();
    lib.classList.add('lib-dropzone');
  });
  lib.addEventListener('dragleave', e=>{
    if(!lib.contains(e.relatedTarget)) lib.classList.remove('lib-dropzone');
  });
  lib.addEventListener('drop', e=>{
    lib.classList.remove('lib-dropzone');
    const idx = draggingFlowIdx;
    if(idx === -1) return;
    flowBlocks.splice(idx,1);
    doneState.splice(idx,1);
    pdoneState.splice(idx,1);
    draggingFlowIdx = -1;
    render();
  });
}

// ── RESET ──
function resetAll(){
  flowBlocks=DEFAULT_FLOW.map(d=>({...d}));
  doneState=flowBlocks.map(()=>false);
  pdoneState=flowBlocks.map(d=>d.pills.map(()=>false));
  document.getElementById('ti').value='';
  document.getElementById('ts').style.display='none';
  document.querySelectorAll('.clrow').forEach(r=>{r.classList.remove('done');r.querySelector('.clbox').classList.remove('on')});
  render();
}

// ── INIT ──
renderLib();
setupLibDrop();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
